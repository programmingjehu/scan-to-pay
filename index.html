<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open the note</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: radial-gradient(circle at top, #fff8fb 0%, #ffd7e6 32%, #ffc2d9 62%, #ffa9c8 100%);
      }

      .entry {
        text-align: center;
        padding: 3rem 2rem;
        background: rgba(255, 255, 255, 0.55);
        border: 1px solid rgba(255,255,255,0.7);
        border-radius: 28px;
        box-shadow: 0 20px 40px rgba(170, 61, 97, 0.14);
      }

      h1 {
        margin: 0 0 1rem;
        color: #8a2f57;
      }

      p {
        margin: 0 0 1.5rem;
        color: #6d3552;
      }

      .open-btn {
        display: inline-block;
        padding: 0.9rem 1.5rem;
        border: 0;
        border-radius: 999px;
        background: linear-gradient(135deg, #ff7db9, #ff5ca8);
        color: white;
        font-size: 1rem;
        font-weight: 700;
        text-decoration: none;
        box-shadow: 0 10px 24px rgba(255, 92, 168, 0.28);
      }
    </style>
  </head>
  <body>
    <div class="entry">
      <h1>ako si anonymous</h1>
      <p>Open the note in a separate page.</p>
  
    </div>
  </body>
</html>
